# fly.toml app configuration file generated for think-code-mediabot on 2026-09-16T17:05:16+05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'think-code-mediabot'
primary_region = 'ams'

[build]
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 25
    soft_limit = 20

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
